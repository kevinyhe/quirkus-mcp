[package]
name = "quirkus-mcp"
version = "0.1.0"
description = "Read-only MCP server for U of T Quercus and ACORN"
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros", "io-std", "io-util"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "brotli", "http2", "cookies"] }
dirs = "7"
pdf-extract = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"

[profile.release]
lto = true
strip = true
